name: LabyAddon Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0  # Full history for better release notes
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'corretto'
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Build with Gradle
        run: ./gradlew build --full-stacktrace
      - name: Create Release Artifact
        run: ./gradlew createReleaseJar
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Artifacts
          path: build/libs/*-release.jar
          retention-days: 90
      - name: Verify artifact download (dynamic, authenticated)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Resolving artifact dynamically ==="
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.expired == false) | .id' | head -n 1)
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::No downloadable artifact found for run $GITHUB_RUN_ID" >&2
            exit 1
          fi
          echo "Artifact ID: $ARTIFACT_ID (resolved dynamically, no hardcoded ID)"
          
          echo "=== Downloading with authentication ==="
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > artifact-verify.zip
          
          echo "=== Validating downloaded artifact ==="
          if [ ! -s artifact-verify.zip ]; then
            echo "::error::Downloaded artifact is empty" >&2
            exit 1
          fi
          
          # Verify it's a valid zip file
          if ! unzip -t artifact-verify.zip >/dev/null 2>&1; then
            echo "::error::Downloaded file is not a valid zip archive" >&2
            exit 1
          fi
          
          # Check for release JAR inside
          if ! unzip -l artifact-verify.zip | grep -q -- '-release\.jar'; then
            echo "::error::No *-release.jar found inside the artifact" >&2
            exit 1
          fi
          
          # Verify JAR is valid (not corrupted)
          JAR_PATH=$(unzip -l artifact-verify.zip | grep -- '-release\.jar' | awk '{print $4}')
          echo "Found JAR in artifact: $JAR_PATH"
          
          echo "=== Artifact download verified successfully ==="
          rm -f artifact-verify.zip
      - name: Generate release notes
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        id: notes
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" HEAD)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          cat > release_notes.md << EOF
          ## LabyVisuals Build

          **Commit:** ${COMMIT_SHA} - ${COMMIT_MSG}
          **Built:** ${TIMESTAMP}
          **Run:** [#${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          ### Installation
          1. Download \`labyvisuals-release.jar\` below
          2. Copy to \`%appdata%\\.laby4\\addons\\\`
          3. Restart LabyMod

          ### Features
          - Target HUD with health display
          - Damage Numbers & Last Hit display
          - Hit Marker, Combo Counter, DPS Stats
          - Inventory HUD & Low Health Vignette
          EOF
          echo "notes_file=release_notes.md" >> $GITHUB_OUTPUT
      - name: Publish latest release
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*-release.jar | head -n 1)
          JAR_NAME=$(basename "$JAR")
          
          # Create release if it doesn't exist
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create latest --repo "$GITHUB_REPOSITORY" \
                 --title "Latest Build" \
                 --notes-file "${{ steps.notes.outputs.notes_file }}"
          
          # Upload (replaces existing asset with same name)
          gh release upload latest --repo "$GITHUB_REPOSITORY" --clobber "$JAR"
          
          echo "Published $JAR_NAME to https://github.com/$GITHUB_REPOSITORY/releases/download/latest/$JAR_NAME"
          rm -f release_notes.md
